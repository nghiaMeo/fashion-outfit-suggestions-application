server:
  port: 8761

spring:
  application:
    name: discovery-service

eureka: ##dev
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 3000

  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
