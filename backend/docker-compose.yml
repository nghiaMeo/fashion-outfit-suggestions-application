services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wardrobe-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILE: prod
      DB_URL: jdbc:postgresql://postgres:5432/wardrobe_fashion_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8080
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17-alpine
    container_name: wardrobe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wardrobe_fashion_db
      POSTGRES_USER: nghiadev
      POSTGRES_PASSWORD: nghia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.4.3-alpine3.22
    container_name: wardrobe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
