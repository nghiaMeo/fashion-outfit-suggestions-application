spring:
  application:
    name: fashion-outfit-service
  profiles:
    active: ${SPRING_PROFILE:dev}
  config:
    import: optional:file:.env[.properties]

  # ==================== SERVER CONFIG ====================
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 8192
    accept-count: 100

  # ==================== MULTIPART UPLOAD ====================
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # ==================== DATASOURCE (PostgreSQL) ====================
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fashion_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # ==================== JPA/HIBERNATE ====================
  jpa:
    hibernate:
      ddl-auto: validate  # Use Flyway for migrations in production
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # ==================== FLYWAY (Database Migrations) ====================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ==================== REDIS CACHE ====================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ==================== CACHE CONFIG ====================
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 1 hour default TTL
    cache-names:
      - user_profile
      - friendship_list
      - outfit_feed
      - search_results

  # ==================== MESSAGE BROKER (RabbitMQ) ====================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    virtual-host: /
    listener:
      simple:
        concurrency: 10
        max-concurrency: 20

  # ==================== MAIL CONFIG ====================
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ==================== JACKSON ====================
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: ${INDENT_OUTPUT:false}
    deserialization:
      fail-on-unknown-properties: false

# ==================== LOGGING ====================
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.example: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ==================== JWT CONFIG ====================
jwt:
  secret-key: ${JWT_SECRET_KEY:your-secret-key-change-in-production}
  access-token-expiration: 86400000    # 24 hours (ms)
  refresh-token-expiration: 604800000  # 7 days (ms)

# ==================== OAUTH2 CONFIG ====================
oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

# ==================== CLOUDINARY CONFIG ====================
cloudinary:
  cloud-name: ${CLOUDINARY_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# ==================== FIREBASE CONFIG ====================
firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  private-key: ${FIREBASE_PRIVATE_KEY:}
  client-email: ${FIREBASE_CLIENT_EMAIL:}
